<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shop | Nairobi Perfumes</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- HEADER (reuse same as index) -->
<header class="main-header">
  <div class="header-left">
    <h1 class="logo">NAIROBI PERFUMES</h1>
  </div>

  <div class="header-center">
    <div class="search-wrapper">
      <input type="text" id="searchBar" placeholder="Search perfumes...">
    </div>
  </div>

  <div class="header-right">
    <div class="cart-icon" onclick="toggleCart()">🛒</div>
  </div>
</header>

<!-- PRODUCTS -->
<section class="products">
  <h2>Shop All Products</h2>
  <div id="products-container"></div>
</section>

<!-- CART (reuse same) -->
<div id="cart-panel" class="cart-panel">
  <div class="cart-header">
    <h3>Your Cart</h3>
    <button onclick="toggleCart()">✕</button>
  </div>

  <div id="cart-items"></div>

  <div class="cart-footer">
    <p id="cart-total"></p>
    <button onclick="checkoutCart()" class="checkout-btn">
      Proceed to Checkout
    </button>
  </div>
</div>

<div id="cart-overlay" class="cart-overlay" onclick="toggleCart()"></div>

<script src="products.js"></script>
<script src="main.js"></script>

</body>
</html>
