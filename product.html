<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Product | Nairobi Perfumes</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="main-header">
  <div class="header-left">
    <h1 class="logo">NAIROBI PERFUMES</h1>
  </div>
</header>

<section class="product-page">

  <img id="product-image" style="width:300px; border-radius:12px;">

  <h1 id="product-name"></h1>

  <p id="product-price"></p>

  <p id="product-description"></p>

  <button id="buy-whatsapp" class="whatsapp-btn">
    Order on WhatsApp
  </button>

  <button onclick="addToCartFromPage()" class="cart-btn">
    Add to Cart
  </button>

</section>

<script src="products.js"></script>
<script src="main.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const product = products.find(p => p.id == id);

if (product) {
  document.getElementById("product-image").src = product.image;
  document.getElementById("product-name").innerText = product.name;
  document.getElementById("product-price").innerText = "KSh " + product.price;
  document.getElementById("product-description").innerText = product.description || "No description available";

  document.getElementById("buy-whatsapp").onclick = () => {
    window.open(
      `https://wa.me/254113505681?text=I want ${product.name}`,
      "_blank"
    );
  };
}

function addToCartFromPage() {
  addToCart(product.name, product.price);
}
</script>

</body>
</html>
