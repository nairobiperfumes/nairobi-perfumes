<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Product | Nairobi Perfumes</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="main-header">
  <div class="header-left">
    <h1 class="logo">NAIROBI PERFUMES</h1>
  </div>
</header>

<section class="product-page">

  <!-- LEFT -->
  <div class="product-gallery">

    <div id="thumbnail-container" class="thumbnail-container"></div>

    <img id="product-image" class="main-product-image">

  </div>

  <!-- RIGHT -->
  <div class="product-details">

    <h1 id="product-name"></h1>

    <div id="product-rating"></div>

    <div class="product-price-box">
      <span id="product-old-price" class="old-price"></span>
      <span id="product-price" class="new-price"></span>
    </div>

    <p id="product-description"></p>

    <p id="product-stock"></p>

    <div id="product-tags" class="product-tags"></div>

    <div class="product-buttons">

      <!-- QUANTITY -->
      <div class="quantity-box">
        <button onclick="decreaseQty()">-</button>
        <input type="number" id="qty" value="1" min="1">
        <button onclick="increaseQty()">+</button>
      </div>

      <!-- WHATSAPP -->
      <button id="buy-whatsapp" class="whatsapp-btn">
        Order on WhatsApp
      </button>

      <!-- CART -->
      <button onclick="addToCartFromPage()" class="cart-btn">
        Add to Cart
      </button>

    </div>

  </div>

</section>

<!-- RELATED PRODUCTS -->
<section class="related-products">
  <h2>You May Also Like</h2>
  <div id="related-products-container"></div>
</section>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <img id="lightbox-image" class="lightbox-image">
</div>

<script src="products.js"></script>
<script src="main.js"></script>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const product = products.find(p => p.id == id);

// ================= LOAD PRODUCT =================
if (product) {

  document.getElementById("product-image").src = product.image;
  document.getElementById("product-name").innerText = product.name;
  document.getElementById("product-price").innerText = "KSh " + product.price;
  document.getElementById("product-old-price").innerText = product.oldPrice ? "KSh " + product.oldPrice : "";
  document.getElementById("product-description").innerText = product.description || "No description available";

  if (product.stock) {
    document.getElementById("product-stock").innerText = `Stock Available: ${product.stock}`;
  }

  if (product.rating) {
    document.getElementById("product-rating").innerHTML = `★★★★★ (${product.rating})`;
  }

  const tagsContainer = document.getElementById("product-tags");
  if (product.tags) {
    product.tags.forEach(tag => {
      tagsContainer.innerHTML += `<span class="product-tag">${tag}</span>`;
    });
  }

  const thumbContainer = document.getElementById("thumbnail-container");
  if (product.images) {
    product.images.forEach(img => {
      thumbContainer.innerHTML += `
        <img src="${img}" class="thumbnail ${img === product.image ? 'active-thumb' : ''}"
        onclick="changeMainImage('${img}', this)">
      `;
    });
  }

  const relatedContainer = document.getElementById("related-products-container");

  const relatedProducts = products
    .filter(p => p.category === product.category && p.id !== product.id)
    .slice(0, 4);

  relatedProducts.forEach(item => {
    relatedContainer.innerHTML += `
      <div class="related-product-card">
        <a href="product.html?id=${item.id}">
          <img src="${item.image}">
        </a>
        <h3>${item.name}</h3>
        <p>KSh ${item.price}</p>
      </div>
    `;
  });

  // WHATSAPP (WITH QUANTITY)
  document.getElementById("buy-whatsapp").onclick = () => {

    const qty = document.getElementById("qty").value;

    window.open(
      `https://wa.me/254113505681?text=Hello Nairobi Perfumes, I want ${qty} x ${product.name}`,
      "_blank"
    );
  };
}

// ================= IMAGE SWITCH =================
function changeMainImage(image, element) {
  document.getElementById("product-image").src = image;

  document.querySelectorAll(".thumbnail")
    .forEach(t => t.classList.remove("active-thumb"));

  element.classList.add("active-thumb");
}

// ================= LIGHTBOX =================
document.getElementById("product-image").addEventListener("click", function () {
  document.getElementById("lightbox").style.display = "flex";
  document.getElementById("lightbox-image").src = this.src;
});

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

// ================= QUANTITY =================
function increaseQty() {
  const qty = document.getElementById("qty");
  qty.value = parseInt(qty.value) + 1;
}

function decreaseQty() {
  const qty = document.getElementById("qty");
  if (parseInt(qty.value) > 1) {
    qty.value = parseInt(qty.value) - 1;
  }
}

// ================= ADD TO CART =================
function addToCartFromPage() {

  const qty = parseInt(document.getElementById("qty").value);

  addToCart(
    product.name,
    product.price,
    qty
  );
}

</script>

</body>
</html>
