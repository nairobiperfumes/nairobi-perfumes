<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout - Nairobi Perfumes</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="checkout">

    <h1>Checkout</h1>

    <!-- LEFT -->
    <div class="checkout-form">

      <input
        id="customer-name"
        placeholder="Name"
      >

      <input
        id="customer-phone"
        placeholder="Phone"
      >

      <input
        id="customer-location"
        placeholder="Location"
      >

      <select id="delivery-area">
        <option value="">Select Delivery Area</option>
        <option>CBD</option>
        <option>Westlands</option>
        <option>Kilimani</option>
      </select>

    </div>

    <!-- RIGHT -->
    <div class="order-summary">

      <h3>Your Order</h3>

      <div id="checkout-items"></div>

      <div
        class="order-total"
        id="checkout-total">
      </div>

      <div class="checkout-actions">

        <button
          class="checkout-btn"
          onclick="sendWhatsAppOrder()">
          Pay via WhatsApp
        </button>

        <button
          class="checkout-secondary"
          onclick="alert('Online payments coming soon')">
          Pay Online
        </button>

        <button
          class="checkout-secondary"
          onclick="window.location.href='index.html'">
          Continue Shopping
        </button>

      </div>

    </div>

  </div>

  <script src="checkout.js"></script>

</body>
</html>
